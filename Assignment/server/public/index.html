<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主題清單</title>
    <!-- Ionic CDN -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB; /* 天蓝色背景 */
            color: black; /* 设置字体颜色为黑色 */
        }
        .list-item {
            background-color: #800080; /* 紫色背景 */
            border-radius: 10px; /* 圆角边框 */
            padding: 1rem; /* 内边距 */
            margin: 0.5rem 0; /* 外边距 */
        }
        .item-content {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .item-title {
            font-weight: bold;
            margin: 0.25rem 0;
            color: rgb(17, 16, 16); /* 标题颜色为白色 */
        }
        .item-subtitle {
            color: #e20808; /* 较浅的颜色 */
            font-size: 0.9em;
        }
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .category-button {
            margin: 0.2rem;
        }
        /* 媒体查询 */
        @media (max-width: 320px) { .item-title { font-size: 1em; } }
        @media (max-width: 375px) { .item-title { font-size: 1.1em; } }
        @media (max-width: 360px) { .item-content { flex-direction: column; } }
        @media (max-width: 412px) { .item-title { font-size: 1.2em; } }
        @media (max-width: 428px) { .item-title { font-size: 1.3em; } }
    </style>
</head>
<body>
    <ion-app>
        <ion-header>
            <ion-toolbar>
                <ion-title>主題清單</ion-title>
            </ion-toolbar>
            <ion-searchbar placeholder="搜尋..."></ion-searchbar>
        </ion-header>

        <ion-content>
            <div>
                <!-- 分類按鈕 -->
                <ion-button class="category-button" id="all" fill="outline">全部</ion-button>
            </div>
            <ion-list></ion-list>

            <!-- 使用者認證 -->
            <ion-input id="username" placeholder="使用者名稱"></ion-input>
            <ion-input id="password" type="password" placeholder="密碼"></ion-input>
            <ion-button id="signup">註冊</ion-button>
            <ion-button id="login">登入</ion-button>
            <ion-button id="logout">登出</ion-button>
        </ion-content>
    </ion-app>
    <script>
        let searchbar = document.querySelector('ion-searchbar');
        let list = document.querySelector('ion-list');
        let template = document.createElement('ion-item'); // 使用 template 生成項目
        template.classList.add('list-item');
        template.innerHTML = `
            <div class="item-content">
                <div>
                    <div class="item-title"></div>
                    <div class="item-subtitle"></div>
                    <div class="item-details"></div>
                    <div class="item-point"></div>
                </div>
                <ion-button class="bookmark-button" fill="outline">收藏</ion-button>
            </div>
        `;

        let currentPage = 1;
        const limit = 5;
        let token = '';

        // 從 API 獲取資料
        async function loadCourses(page = 1, search = '', category = '') {
            try {
                const response = await fetch(`https://dae-mobile-assignment.hkit.cc/api/courses?page=${page}&limit=${limit}&search=${search}&category=${category}`);
                if (!response.ok) throw new Error('網路錯誤，無法載入資料');
                const data = await response.json();
                return data.items;
            } catch (error) {
                console.error(error);
                alert('載入資料時出現錯誤');
                return [];
            }
        }

        // 更新清單顯示
        async function updateList(selectedCategory) {
            list.innerHTML = ''; // 清空清單
            const searchQuery = searchbar.value.toLowerCase();
            const courses = await loadCourses(currentPage, searchQuery, selectedCategory);

            for (let item of courses) {
                let node = template.cloneNode(true);
                node.querySelector('.item-title').textContent = item.title; // 假設 API 返回有 title 屬性
                node.querySelector('.item-subtitle').textContent = item.category; // 假設有 category 屬性
                node.querySelector('.item-details').textContent = item.level; // 假設有 level 屬性
                node.querySelector('.item-point').textContent = item.description; // 假設有 description 屬性
                
                // 設置收藏按鈕事件
                node.querySelector('.bookmark-button').addEventListener('click', () => {
                    toggleBookmark(item.id);
                });

                list.appendChild(node);
            }
        }

        // 切換收藏狀態
        async function toggleBookmark(itemId) {
            const method = await isBookmarked(itemId) ? 'DELETE' : 'POST';
            const url = `https://dae-mobile-assignment.hkit.cc/api/bookmarks/${itemId}`;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                alert(data.message);
                updateList(''); // 更新清單
            } catch (error) {
                console.error(error);
                alert('操作收藏時出現錯誤');
            }
        }

        // 檢查項目是否已被收藏
        async function isBookmarked(itemId) {
            try {
                const response = await fetch(`https://dae-mobile-assignment.hkit.cc/api/bookmarks`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                return data.item_ids.includes(itemId);
            } catch (error) {
                console.error(error);
                return false;
            }
        }

        // 使用者註冊
        async function signup(username, password) {
            try {
                const response = await fetch('https://dae-mobile-assignment.hkit.cc/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                token = data.token; // 儲存 token
                alert('註冊成功');
            } catch (error) {
                console.error(error);
                alert('註冊失敗');
            }
        }

        // 使用者登入
        async function login(username, password) {
            try {
                const response = await fetch('https://dae-mobile-assignment.hkit.cc/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                token = data.token; // 儲存 token
                alert('登入成功');
            } catch (error) {
                console.error(error);
                alert('登入失敗');
            }
        }

        // 使用者登出
        function logout() {
            token = ''; // 清除 token
            alert('已登出');
        }

        searchbar.addEventListener('ionInput', () => {
            updateList();
        });

        // 監聽分類按鈕點擊事件
        document.querySelectorAll('.category-button').forEach(button => {
            button.addEventListener('click', () => {
                let selectedCategory = button.id === 'all' ? '' : button.id;
                updateList(selectedCategory);
                // 標記選擇的按鈕
                document.querySelectorAll('.category-button').forEach(btn => {
                    btn.fill = btn.id === selectedCategory ? 'solid' : 'outline';
                });
            });
        });

        // 監聽註冊、登入和登出按鈕
        document.getElementById('signup').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            signup(username, password);
        });

        document.getElementById('login').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            login(username, password);
        });

        document.getElementById('logout').addEventListener('click', () => {
            logout();
        });

        // 初始化載入資料
        updateList('');
    </script>
</body>
</html>
