<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主題清單</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB;
            color: black;
        }
        .list-item {
            background-color: #800080;
            border-radius: 10px;
            padding: 1rem;
            margin: 0.5rem 0;
        }
        .item-content {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .item-title {
            font-weight: bold;
            margin: 0.25rem 0;
            color: rgb(17, 16, 16);
        }
        .item-subtitle {
            color: #e20808;
            font-size: 0.9em;
        }
        @media (max-width: 320px) { .item-title { font-size: 1em; } }
        @media (max-width: 375px) { .item-title { font-size: 1.1em; } }
        @media (max-width: 360px) { .item-content { flex-direction: column; } }
        @media (max-width: 412px) { .item-title { font-size: 1.2em; } }
        @media (max-width: 428px) { .item-title { font-size: 1.3em; } }
    </style>
</head>
<body>
    <ion-app>
        <ion-header>
            <ion-toolbar>
                <ion-title>主題清單</ion-title>
            </ion-toolbar>
            <ion-searchbar placeholder="搜尋..."></ion-searchbar>
        </ion-header>

        <ion-content>
            <ion-list></ion-list>

            <ion-input id="username" placeholder="使用者名稱"></ion-input>
            <ion-input id="password" type="password" placeholder="密碼"></ion-input>
            <ion-button id="signup">註冊</ion-button>
            <ion-button id="login" style="display: none;">登入</ion-button>
            <ion-button id="logout" style="display: none;">登出</ion-button>
        </ion-content>
    </ion-app>

    <script>
        let searchbar = document.querySelector('ion-searchbar');
        let list = document.querySelector('ion-list');
        let loginButton = document.getElementById('login');
        let logoutButton = document.getElementById('logout');
        let template = document.createElement('ion-item');
        template.classList.add('list-item');
        template.innerHTML = `
            <div class="item-content">
                <div>
                    <div class="item-title"></div>
                    <div class="item-subtitle"></div>
                    <div class="item-details"></div>
                    <div class="item-point"></div>
                </div>
                <ion-button class="bookmark-button" fill="outline">收藏</ion-button>
                <ion-button class="unbookmark-button" fill="outline" style="display:none;">取消收藏</ion-button>
            </div>
        `;

        let currentPage = 1;
        const limit = 5;
        let token = '';

        function updateAuthButtons() {
            if (token) {
                loginButton.style.display = 'none';
                logoutButton.style.display = 'inline-block';
            } else {
                loginButton.style.display = 'inline-block';
                logoutButton.style.display = 'none';
            }
        }

        async function updateList() {
            list.innerHTML = '';
            const searchQuery = searchbar.value.toLowerCase();
            const courses = await loadCourses(currentPage, searchQuery);

            if (courses.length === 0) {
                let noItem = document.createElement('ion-item');
                noItem.textContent = '沒有找到任何項目';
                list.appendChild(noItem);
            }

            for (let item of courses) {
                let node = template.cloneNode(true);
                node.querySelector('.item-title').textContent = item.title;
                node.querySelector('.item-subtitle').textContent = item.category;
                node.querySelector('.item-details').textContent = item.level;
                node.querySelector('.item-point').textContent = item.description;

                const bookmarked = await isBookmarked(item.id);
                if (bookmarked) {
                    node.querySelector('.bookmark-button').style.display = 'none';
                    node.querySelector('.unbookmark-button').style.display = 'inline-block';
                }

                node.querySelector('.bookmark-button').addEventListener('click', () => {
                    toggleBookmark(item.id, true);
                });

                node.querySelector('.unbookmark-button').addEventListener('click', () => {
                    toggleBookmark(item.id, false);
                });

                list.appendChild(node);
            }
        }

        async function loadCourses(page = 1, search = '') {
            try {
                const response = await fetch(`https://dae-mobile-assignment.hkit.cc/api/courses?page=${page}&limit=${limit}&search=${search}`);
                if (!response.ok) throw new Error('網路錯誤，無法載入資料');
                const data = await response.json();
                return data.items;
            } catch (error) {
                console.error('Error fetching courses:', error);
                alert('載入資料時出現錯誤: ' + error.message);
                return [];
            }
        }

        async function toggleBookmark(itemId, isBookmark) {
            const method = isBookmark ? 'POST' : 'DELETE';
            const url = `https://dae-mobile-assignment.hkit.cc/api/bookmarks/${itemId}`;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                alert(data.message);
                updateList();
            } catch (error) {
                console.error('Error toggling bookmark:', error);
                alert('操作收藏時出現錯誤: ' + error.message);
            }
        }

        async function isBookmarked(itemId) {
            try {
                const response = await fetch(`https://dae-mobile-assignment.hkit.cc/api/bookmarks`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                return data.item_ids.includes(itemId);
            } catch (error) {
                console.error('Error checking bookmark status:', error);
                return false;
            }
        }

        function validateInput(input) {
            const regex = /^[a-zA-Z0-9]+$/;  // 只允许字母和数字
            return regex.test(input);
        }

        async function signup(username, password) {
            if (!validateInput(username) || !validateInput(password)) {
                alert('使用者名稱和密碼只能包含字母和數字。');
                return;
            }

            try {
                const response = await fetch('https://dae-mobile-assignment.hkit.cc/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                token = data.token;
                alert('註冊成功');
                updateList();
                clearInputs();
                updateAuthButtons(); // 更新按钮状态
            } catch (error) {
                console.error('Error during signup:', error);
                alert('註冊失敗: ' + error.message);
            }
        }

        async function login(username, password) {
            if (!validateInput(username) || !validateInput(password)) {
                alert('使用者名稱和密碼只能包含字母和數字。');
                return;
            }

            try {
                const response = await fetch('https://dae-mobile-assignment.hkit.cc/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                token = data.token;
                alert('登入成功');
                updateList();
                clearInputs();
                updateAuthButtons(); // 更新按钮状态
            } catch (error) {
                console.error('Error during login:', error);
                alert('登入失敗: ' + error.message);
            }
        }

        function clearInputs() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function logout() {
            token = '';
            alert('已登出');
            updateList();
            updateAuthButtons(); // 更新按钮状态
        }

        searchbar.addEventListener('ionInput', () => {
            updateList();
        });

        document.getElementById('signup').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            signup(username, password);
        });

        document.getElementById('login').addEventListener('click', () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            login(username, password);
        });

        document.getElementById('logout').addEventListener('click', () => {
            logout();
        });

        document.addEventListener('DOMContentLoaded', () => {
            updateList(); // 初始加载所有课程
            updateAuthButtons(); // 更新按钮状态
        });
    </script>
</body>
</html>
